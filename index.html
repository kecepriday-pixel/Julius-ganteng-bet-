
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Gallery</title>

<style>
:root {
  --bg: #0b0b0d;
  --panel: #18181b;
  --text: #f5f5f5;
  --muted: #929299;
  --border: #29292e;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

header {
  max-width: 1200px;
  margin: auto;
  padding: 24px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.count {
  font-size: 13px;
  color: var(--muted);
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 55px 20px 70px;
}

.intro {
  margin-bottom: 35px;
}

.intro h1 {
  font-size: clamp(35px, 7vw, 65px);
  letter-spacing: -2px;
  margin: 0 0 12px;
}

.intro p {
  color: var(--muted);
  font-size: 15px;
  margin: 0;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

.toolbar span {
  color: var(--muted);
  font-size: 13px;
}

.search {
  background: var(--panel);
  color: white;
  border: 1px solid var(--border);
  padding: 12px 15px;
  border-radius: 10px;
  outline: none;
  width: 220px;
}

.search:focus {
  border-color: #888;
}

.gallery {
  columns: 3;
  column-gap: 15px;
}

.photo {
  position: relative;
  display: block;
  width: 100%;
  margin: 0 0 15px;
  padding: 0;
  border: 0;
  background: var(--panel);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  break-inside: avoid;
  animation: appear .5s ease both;
}

.photo img {
  display: block;
  width: 100%;
  height: auto;
  transition: transform .4s ease;
}

.photo:hover img {
  transform: scale(1.04);
}

.photo-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 35px 15px 15px;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.8)
  );
  text-align: left;
  opacity: 0;
  transition: opacity .25s;
}

.photo:hover .photo-info,
.photo:focus-visible .photo-info {
  opacity: 1;
}

.photo-info strong {
  font-size: 14px;
  color: white;
}

.photo-info small {
  display: block;
  margin-top: 5px;
  color: #ddd;
}

.empty {
  color: var(--muted);
  padding: 40px 0;
  text-align: center;
}

.viewer {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.97);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 65px 15px 80px;
}

.viewer.active {
  display: flex;
}

.viewer img {
  max-width: 100%;
  max-height: 72vh;
  object-fit: contain;
  border-radius: 5px;
}

.viewer-info {
  text-align: center;
  margin-top: 18px;
}

.viewer-info h2 {
  margin: 0;
  font-size: 17px;
}

.viewer-info p {
  color: var(--muted);
  margin: 8px 0;
  font-size: 13px;
}

.close {
  position: absolute;
  top: 20px;
  right: 22px;
  background: none;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
}

.controls {
  position: absolute;
  bottom: 25px;
  display: flex;
  align-items: center;
  gap: 30px;
}

.controls button {
  background: #242428;
  border: 1px solid #444;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.controls span {
  font-size: 13px;
  color: #aaa;
}

footer {
  border-top: 1px solid var(--border);
  padding: 25px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 800px) {
  .gallery {
    columns: 2;
  }
}

@media (max-width: 480px) {
  .container {
    padding-top: 40px;
  }

  .gallery {
    columns: 2;
    column-gap: 9px;
  }

  .photo {
    margin-bottom: 9px;
    border-radius: 8px;
  }

  .toolbar {
    align-items: stretch;
  }

  .search {
    width: 55%;
  }

  .photo-info {
    opacity: 1;
    padding: 25px 10px 10px;
  }

  .photo-info strong {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Gallery.</div>
  <div class="count" id="total">0 Photos</div>
</header>

<main class="container">

  <div class="intro">
    <h1>Photo Gallery</h1>
    <p>2026 — Yogyakarta</p>
  </div>

  <div class="toolbar">
    <span id="resultCount">All photos</span>
    <input
      type="search"
      class="search"
      id="search"
      placeholder="Cari foto..."
      aria-label="Cari foto"
    >
  </div>

  <div class="gallery" id="gallery"></div>
  <p class="empty" id="empty" hidden>
    Foto tidak ditemukan.
  </p>

</main>

<div class="viewer" id="viewer"
     role="dialog"
     aria-modal="true"
     aria-label="Lihat foto">

  <button class="close" id="close"
          aria-label="Tutup">×</button>

  <img id="viewerImage" alt="">

  <div class="viewer-info">
    <h2 id="viewerTitle"></h2>
    <p id="viewerDate"></p>
  </div>

  <div class="controls">
    <button id="prev" aria-label="Foto sebelumnya">‹</button>
    <span id="position"></span>
    <button id="next" aria-label="Foto berikutnya">›</button>
  </div>

</div>

<footer>
  Gallery © 2026
</footer>

<script>

// DAFTAR FOTO DARI GITHUB

const photos = [
  {
    file: "IMG-20261003-WA0044.jpg",
    title: "Foto 01",
    date: "3 Oktober 2026"
  },
  {
    file: "IMG-20261003-WA0045(1).jpg",
    title: "Foto 02",
    date: "3 Oktober 2026"
  },
  {
    file: "IMG-20261007-WA0319.jpg",
    title: "Foto 03",
    date: "7 Oktober 2026"
  },
  {
    file: "IMG-20261007-WA0322.jpg",
    title: "Foto 04",
    date: "7 Oktober 2026"
  },
  {
    file: "IMG-20261007-WA0346.jpg",
    title: "Foto 05",
    date: "7 Oktober 2026"
  },
  {
    file: "IMG-20261008-WA0060.jpg",
    title: "Foto 06",
    date: "8 Oktober 2026"
  },
  {
    file: "motion_photo_1994333974690979546.jpg",
    title: "Foto 07",
    date: ""
  },
  {
    file: "motion_photo_2296987604447339933.jpg",
    title: "Foto 08",
    date: ""
  },
  {
    file: "motion_photo_467851693740930525.jpg",
    title: "Foto 09",
    date: ""
  }
];

const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const viewerTitle = document.getElementById("viewerTitle");
const viewerDate = document.getElementById("viewerDate");
const position = document.getElementById("position");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

let visiblePhotos = [...photos];
let currentIndex = 0;

document.getElementById("total").textContent =
  photos.length + " Photos";

function render() {
  const query = search.value.toLowerCase();

  visiblePhotos = photos.filter(p =>
    (p.title + " " + p.date + " " + p.file)
      .toLowerCase()
      .includes(query)
  );

  gallery.innerHTML = "";

  document.getElementById("resultCount").textContent =
    visiblePhotos.length + " foto";

  empty.hidden = visiblePhotos.length !== 0;

  visiblePhotos.forEach((p, index) => {
    const card = document.createElement("button");
    card.className = "photo";
    card.type = "button";

    const img = document.createElement("img");
    img.src = "images/" + p.file;
    img.alt = p.title;
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "photo-info";

    const title = document.createElement("strong");
    title.textContent = p.title;

    const date = document.createElement("small");
    date.textContent = p.date;

    info.append(title, date);
    card.append(img, info);

    card.onclick = () => openPhoto(index);
    gallery.append(card);
  });
}

function openPhoto(index) {
  currentIndex = index;
  updateViewer();
  viewer.classList.add("active");
  document.body.style.overflow = "hidden";
}

function updateViewer() {
  const p = visiblePhotos[currentIndex];
  if (!p) return;

  viewerImage.src = "images/" + p.file;
  viewerImage.alt = p.title;
  viewerTitle.textContent = p.title;
  viewerDate.textContent = p.date;

  position.textContent =
    (currentIndex + 1) + " / " + visiblePhotos.length;
}

function closeViewer() {
  viewer.classList.remove("active");
  document.body.style.overflow = "";
}

function changePhoto(step) {
  currentIndex =
    (currentIndex + step + visiblePhotos.length)
    % visiblePhotos.length;

  updateViewer();
}

document.getElementById("close").onclick = closeViewer;
document.getElementById("prev").onclick = () => changePhoto(-1);
document.getElementById("next").onclick = () => changePhoto(1);

search.addEventListener("input", render);

viewer.addEventListener("click", e => {
  if (e.target === viewer) closeViewer();
});

document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("active")) return;

  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") changePhoto(1);
  if (e.key === "ArrowLeft") changePhoto(-1);
});

// GESER FOTO DI HP
let touchStart = 0;

viewer.addEventListener("touchstart", e => {
  touchStart = e.changedTouches[0].screenX;
}, {passive:true});

viewer.addEventListener("touchend", e => {
  const difference =
    e.changedTouches[0].screenX - touchStart;

  if (Math.abs(difference) > 60) {
    changePhoto(difference < 0 ? 1 : -1);
  }
}, {passive:true});

render();

</script>
</body>
</html>
