
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11110f">
<title>Gallery — 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root{
 --bg:#11110f;
 --fg:#f2eee5;
 --muted:#aaa69e;
 --line:#35332e;
 --accent:#d7c3a0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);
 color:var(--fg);
 font-family:'DM Sans',sans-serif;
}
header{
 padding:25px 6%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid var(--line);
}
.brand{
 font-family:'Playfair Display',serif;
 font-size:24px;
 letter-spacing:-1px;
}
header span{
 font-size:11px;
 color:var(--muted);
 letter-spacing:2px;
}
.hero{
 padding:85px 6% 65px;
 max-width:1200px;
 margin:auto;
}
.eyebrow{
 font-size:11px;
 color:var(--accent);
 letter-spacing:3px;
 text-transform:uppercase;
}
.hero h1{
 font-family:'Playfair Display',serif;
 font-weight:500;
 font-size:clamp(58px,12vw,120px);
 line-height:1.05;
 letter-spacing:-3px;
 margin:20px 0;
}
.hero h1 em{
 color:var(--accent);
 font-weight:500;
}
.hero-bottom{
 display:flex;
 justify-content:space-between;
 gap:20px;
 align-items:end;
 border-top:1px solid var(--line);
 padding-top:22px;
 margin-top:45px;
}
.hero-bottom p{
 color:var(--muted);
 margin:0;
 font-size:13px;
 line-height:1.8;
}
.number{
 font-family:'Playfair Display',serif;
 font-size:30px;
}
main{
 max-width:1200px;
 margin:auto;
 padding:0 6% 100px;
}
.section-heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:25px;
}
.section-heading h2{
 font-size:14px;
 font-weight:500;
 letter-spacing:1px;
}
.section-heading span{
 font-size:12px;
 color:var(--muted);
}
.gallery{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:30px 20px;
}
.photo{
 min-width:0;
 margin:0;
 cursor:pointer;
}
.photo:first-child{
 grid-column:1/-1;
 margin-bottom:25px;
}
.photo button{
 display:block;
 border:0;
 padding:0;
 width:100%;
 background:#24231f;
 cursor:pointer;
 overflow:hidden;
}
.photo img{
 display:block;
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .6s ease,filter .5s;
}
.photo button:hover img{
 transform:scale(1.035);
 filter:brightness(.9);
}
.photo .frame{
 aspect-ratio:4/5;
}
.photo:nth-child(3n+2) .frame{
 aspect-ratio:3/4;
}
.photo:nth-child(3n+3) .frame{
 aspect-ratio:1/1;
}
.photo:first-child .frame{
 aspect-ratio:16/10;
}
.meta{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:start;
 padding:13px 0;
 border-bottom:1px solid var(--line);
}
.meta strong{
 font-size:13px;
 font-weight:500;
}
.meta span{
 font-size:11px;
 color:var(--muted);
 white-space:nowrap;
}
.photo:first-child .meta strong{
 font-size:17px;
}
footer{
 border-top:1px solid var(--line);
 padding:35px 6%;
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:11px;
 letter-spacing:1px;
}
.lightbox{
 position:fixed;
 inset:0;
 background:rgba(8,8,8,.98);
 z-index:100;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 padding:55px 15px 75px;
}
.lightbox.open{display:flex}
.lightbox img{
 max-width:100%;
 max-height:76vh;
 object-fit:contain;
}
.lightbox p{
 color:var(--muted);
 font-size:12px;
 text-align:center;
}
.close{
 position:absolute;
 top:17px;right:22px;
 background:none;
 border:0;
 color:white;
 font-size:32px;
 cursor:pointer;
}
.controls{
 position:absolute;
 bottom:20px;
 display:flex;
 align-items:center;
 gap:35px;
}
.controls button{
 background:none;
 color:white;
 border:1px solid #555;
 width:42px;height:42px;
 border-radius:50%;
 font-size:24px;
 cursor:pointer;
}
.controls span{
 font-size:12px;
 color:var(--muted);
}
@media(max-width:600px){
 header{padding:22px 5%}
 .hero{padding:70px 5% 45px}
 .hero h1{
  font-size:65px;
  letter-spacing:-2px;
 }
 main{padding:0 5% 70px}
 .gallery{gap:22px 11px}
 .photo:first-child{margin-bottom:12px}
 .photo:first-child .frame{aspect-ratio:4/5}
 .meta{flex-direction:column;gap:5px}
 .meta strong{font-size:12px}
 .meta span{font-size:10px}
 .photo:first-child .meta{flex-direction:row}
 .hero-bottom{margin-top:35px}
}
@media(prefers-reduced-motion:reduce){
 *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>

<header>
 <div class="brand">Gallery.</div>
 <span>EST. 2026</span>
</header>

<section class="hero">
 <div class="eyebrow">Personal photo collection</div>
 <h1>Life in<br><em>Frames.</em></h1>
 <div class="hero-bottom">
  <p>Yogyakarta, Indonesia<br>2026</p>
  <div class="number">01 — 09</div>
 </div>
</section>

<main>
 <div class="section-heading">
  <h2>THE COLLECTION</h2>
  <span>09 PHOTOS</span>
 </div>
 <div class="gallery" id="gallery"></div>
</main>

<footer>
 <span>GALLERY © 2026</span>
 <span>YOGYAKARTA</span>
</footer>

<div class="lightbox" id="lightbox"
 role="dialog" aria-modal="true"
 aria-label="Lihat foto">
 <button class="close" id="close" aria-label="Tutup">×</button>
 <img id="largeImage" alt="">
 <p id="caption"></p>
 <div class="controls">
  <button id="prev" aria-label="Sebelumnya">‹</button>
  <span id="counter"></span>
  <button id="next" aria-label="Berikutnya">›</button>
 </div>
</div>

<script>
const photos=[
 {
  file:"IMG-20261003-WA0044.jpg",
  title:"Tugu Jogja",
  date:"03.10.2026"
 },
 {
  file:"IMG-20261003-WA0045(1).jpg",
  title:"Yogyakarta",
  date:"03.10.2026"
 },
 {
  file:"IMG-20261007-WA0319.jpg",
  title:"Bersama Teman",
  date:"07.10.2026"
 },
 {
  file:"IMG-20261007-WA0322.jpg",
  title:"Foto Bersama",
  date:"07.10.2026"
 },
 {
  file:"IMG-20261007-WA0346.jpg",
  title:"Waktu Luang",
  date:"07.10.2026"
 },
 {
  file:"IMG-20261008-WA0060.jpg",
  title:"Foto Grup",
  date:"08.10.2026"
 },
 {
  file:"motion_photo_1994333974690979546.jpg",
  title:"Bersama Teman",
  date:"2026"
 },
 {
  file:"motion_photo_2296987604447339933.jpg",
  title:"Foto Bersama",
  date:"2026"
 },
 {
  file:"motion_photo_467851693740930525.jpg",
  title:"Photobox",
  date:"2026"
 }
];

const gallery=document.getElementById("gallery");
const lightbox=document.getElementById("lightbox");
let current=0;

photos.forEach((p,i)=>{
 const figure=document.createElement("figure");
 figure.className="photo";

 const button=document.createElement("button");
 button.className="frame";
 button.type="button";
 button.setAttribute("aria-label","Buka "+p.title);

 const img=document.createElement("img");
 img.src="images/"+p.file;
 img.alt=p.title;
 img.loading=i===0?"eager":"lazy";

 button.append(img);
 button.onclick=()=>openPhoto(i);

 const meta=document.createElement("figcaption");
 meta.className="meta";

 const title=document.createElement("strong");
 title.textContent=p.title;

 const date=document.createElement("span");
 date.textContent=p.date;

 meta.append(title,date);
 figure.append(button,meta);
 gallery.append(figure);
});

function openPhoto(i){
 current=i;
 updatePhoto();
 lightbox.classList.add("open");
 document.body.style.overflow="hidden";
}
function updatePhoto(){
 const p=photos[current];
 document.getElementById("largeImage").src="images/"+p.file;
 document.getElementById("largeImage").alt=p.title;
 document.getElementById("caption").textContent=p.title+" — "+p.date;
 document.getElementById("counter").textContent=
  (current+1)+" / "+photos.length;
}
function change(step){
 current=(current+step+photos.length)%photos.length;
 updatePhoto();
}
function closePhoto(){
 lightbox.classList.remove("open");
 document.body.style.overflow="";
}
document.getElementById("close").onclick=closePhoto;
document.getElementById("prev").onclick=()=>change(-1);
document.getElementById("next").onclick=()=>change(1);
lightbox.onclick=e=>{
 if(e.target===lightbox)closePhoto();
};
document.addEventListener("keydown",e=>{
 if(!lightbox.classList.contains("open"))return;
 if(e.key==="Escape")closePhoto();
 if(e.key==="ArrowRight")change(1);
 if(e.key==="ArrowLeft")change(-1);
});
let startX=0;
lightbox.addEventListener("touchstart",e=>{
 startX=e.changedTouches[0].screenX;
},{passive:true});
lightbox.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].screenX-startX;
 if(Math.abs(dx)>60)change(dx<0?1:-1);
},{passive:true});
</script>
</body>
</html>
