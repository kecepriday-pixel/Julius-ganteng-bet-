
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album Kampus</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101114;color:#eee;
 font-family:Arial,sans-serif
}
header{
 padding:22px 6%;display:flex;
 justify-content:space-between;align-items:center;
 border-bottom:1px solid #292b30
}
.logo{font-weight:700;letter-spacing:1px}
nav a{color:#aaa;text-decoration:none;margin-left:15px}
nav a:hover{color:white}
.hero{padding:75px 6% 55px;max-width:900px}
.small{color:#aaa;font-size:13px;letter-spacing:2px}
h1{font-size:clamp(34px,7vw,65px);margin:14px 0}
p{color:#aaa;line-height:1.7}
main{padding:0 6% 65px}
.bar{
 display:flex;justify-content:space-between;
 align-items:center;gap:15px;flex-wrap:wrap;
 margin-bottom:25px
}
input{
 background:#1c1e23;border:1px solid #333;
 padding:12px;border-radius:8px;color:white;
 width:230px;max-width:100%
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:22px
}
.card{
 background:#1a1c20;border:1px solid #2b2d32;
 border-radius:12px;overflow:hidden;
 cursor:pointer;transition:.25s
}
.card:hover{transform:translateY(-5px);border-color:#777}
.card img{
 width:100%;height:250px;object-fit:cover;
 display:block
}
.info{padding:18px}
.info h3{margin:8px 0}
.date{font-size:12px;color:#999}
.info p{font-size:14px;margin-bottom:0}
.empty{
 padding:45px;text-align:center;
 border:1px dashed #444;border-radius:12px
}
.modal{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.92);
 z-index:10;overflow:auto;padding:45px 20px
}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal-content{max-width:700px;width:100%;text-align:center}
.modal img{
 max-width:100%;max-height:65vh;
 object-fit:contain;border-radius:8px
}
.close{
 position:fixed;right:20px;top:15px;
 background:none;border:0;color:white;
 font-size:35px;cursor:pointer
}
footer{
 border-top:1px solid #292b30;
 text-align:center;padding:30px;color:#888
}
@media(max-width:600px){
 header{padding:18px 5%}
 .hero{padding:55px 5% 35px}
 main{padding:0 5% 45px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .card img{height:165px}
 .info{padding:12px}
 .info h3{font-size:15px}
 .info p{font-size:12px}
 input{width:100%}
}
</style>
</head>
<body>

<header>
 <div class="logo">ALBUM KAMPUS</div>
 <nav><a href="#galeri">Galeri</a></nav>
</header>

<section class="hero">
 <div class="small">DOKUMENTASI KAMPUS</div>
 <h1>Album Foto</h1>
 <p>Kumpulan foto kegiatan, teman, dan keseharian selama kuliah.</p>
</section>

<main id="galeri">
 <div class="bar">
  <h2>Galeri Foto</h2>
  <input id="search" placeholder="Cari foto...">
 </div>
 <div class="grid" id="gallery"></div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detail foto">
 <button class="close" id="close" aria-label="Tutup">×</button>
 <div class="modal-content">
  <img id="bigPhoto" alt="">
  <h2 id="bigTitle"></h2>
  <p id="bigDate"></p>
  <p id="bigStory"></p>
 </div>
</div>

<footer>Album Kampus © 2026</footer>

<script>
// EDIT DATA FOTO DI BAGIAN INI
const photos = [
 {
  image:"images/foto1.jpg",
  title:"Foto Bersama",
  date:"9 Oktober 2026",
  location:"Kampus",
  story:"Foto bersama teman-teman setelah kelas."
 },
 {
  image:"images/foto2.jpg",
  title:"Kegiatan Kampus",
  date:"10 Oktober 2026",
  location:"Kampus",
  story:"Dokumentasi kegiatan bersama teman sekelas."
 },
 {
  image:"images/foto3.jpg",
  title:"Waktu Istirahat",
  date:"12 Oktober 2026",
  location:"Kampus",
  story:"Foto saat istirahat setelah perkuliahan."
 }
];

const gallery=document.getElementById("gallery");
const modal=document.getElementById("modal");

function render(query=""){
 gallery.innerHTML="";
 const filtered=photos.filter(p=>
  (p.title+" "+p.story+" "+p.location+" "+p.date)
  .toLowerCase().includes(query.toLowerCase())
 );
 if(!filtered.length){
  gallery.innerHTML='<div class="empty">Tidak ada foto yang cocok.</div>';
  return;
 }
 filtered.forEach(p=>{
  const card=document.createElement("article");
  card.className="card";
  const img=document.createElement("img");
  img.src=p.image;
  img.alt=p.title;
  img.loading="lazy";
  const info=document.createElement("div");
  info.className="info";
  const date=document.createElement("div");
  date.className="date";
  date.textContent=p.date+" · "+p.location;
  const title=document.createElement("h3");
  title.textContent=p.title;
  const story=document.createElement("p");
  story.textContent=p.story;
  info.append(date,title,story);
  card.append(img,info);
  card.onclick=()=>openPhoto(p);
  gallery.append(card);
 });
}

function openPhoto(p){
 document.getElementById("bigPhoto").src=p.image;
 document.getElementById("bigPhoto").alt=p.title;
 document.getElementById("bigTitle").textContent=p.title;
 document.getElementById("bigDate").textContent=p.date+" · "+p.location;
 document.getElementById("bigStory").textContent=p.story;
 modal.classList.add("open");
 document.body.style.overflow="hidden";
}
function closePhoto(){
 modal.classList.remove("open");
 document.body.style.overflow="";
}
document.getElementById("close").onclick=closePhoto;
modal.onclick=e=>{if(e.target===modal)closePhoto()};
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closePhoto();
});
document.getElementById("search").oninput=e=>render(e.target.value);
render();
</script>
</body>
</html>
